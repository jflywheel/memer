<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      padding: 2rem 1rem 1rem;
      text-align: center;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: #888;
      margin-top: 0.5rem;
      font-size: 1rem;
    }

    .input-area {
      width: 100%;
      max-width: 640px;
      padding: 1rem;
      margin-top: 1rem;
    }

    .input-area textarea {
      width: 100%;
      padding: 1rem;
      font-size: 1rem;
      font-family: inherit;
      background: #1a1a1a;
      border: 2px solid #333;
      border-radius: 12px;
      color: #e0e0e0;
      resize: vertical;
      min-height: 80px;
      transition: border-color 0.2s;
    }

    .input-area textarea:focus {
      outline: none;
      border-color: #ff6b6b;
    }

    .input-area textarea::placeholder {
      color: #555;
    }

    .input-area button {
      margin-top: 0.75rem;
      width: 100%;
      padding: 0.85rem;
      font-size: 1.1rem;
      font-weight: 600;
      background: linear-gradient(135deg, #ff6b6b, #ee5a24);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .input-area button:hover { opacity: 0.9; }
    .input-area button:active { transform: scale(0.98); }
    .input-area button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: #888;
      font-size: 1.1rem;
    }

    .loading .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid #333;
      border-top-color: #ff6b6b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 0.5rem;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .results {
      width: 100%;
      max-width: 640px;
      padding: 0 1rem 2rem;
    }

    .meme-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      transition: border-color 0.2s;
    }

    .meme-card:hover { border-color: #444; }

    .meme-card .meme-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .meme-card .meme-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
    }

    .meme-card .meme-type {
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .meme-type.image { background: #2d3436; color: #74b9ff; }
    .meme-type.gif { background: #2d3436; color: #55efc4; }

    .meme-card .meme-text {
      background: #111;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.75rem;
    }

    .meme-card .slot {
      margin-bottom: 0.5rem;
    }

    .meme-card .slot:last-child { margin-bottom: 0; }

    .meme-card .slot-label {
      font-size: 0.7rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.15rem;
    }

    .meme-card .slot-value {
      font-size: 1rem;
      color: #fff;
      font-weight: 500;
    }

    .meme-card .meme-image {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 0.75rem;
      max-height: 400px;
      object-fit: contain;
      background: #111;
    }

    .meme-card .explanation {
      font-size: 0.85rem;
      color: #888;
      font-style: italic;
    }

    .error-msg {
      text-align: center;
      padding: 1.5rem;
      color: #ff6b6b;
      font-size: 0.95rem;
    }

    .examples {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }

    .examples button {
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 20px;
      color: #aaa;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      width: auto;
      font-weight: 400;
    }

    .examples button:hover {
      border-color: #ff6b6b;
      color: #fff;
      background: #222;
    }
  </style>
</head>
<body>
  <header>
    <h1>Memer</h1>
    <p>Describe a situation or paste a news headline. Get the perfect memes.</p>
  </header>

  <div class="input-area">
    <textarea id="prompt" placeholder="e.g. 'When the meeting that could've been an email finally ends' or paste a news headline..." rows="3"></textarea>
    <div class="examples">
      <button onclick="useExample(this)">Meeting that could've been an email</button>
      <button onclick="useExample(this)">Congress can't agree on anything</button>
      <button onclick="useExample(this)">My code works but I don't know why</button>
      <button onclick="useExample(this)">Bitcoin hit a new all time high</button>
    </div>
    <button id="generate" onclick="generate()">Generate Memes</button>
  </div>

  <div id="output" class="results"></div>

  <script>
    const promptEl = document.getElementById("prompt");
    const outputEl = document.getElementById("output");
    const btnEl = document.getElementById("generate");

    function useExample(el) {
      promptEl.value = el.textContent;
      promptEl.focus();
    }

    // Submit on Ctrl+Enter or Cmd+Enter
    promptEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
        generate();
      }
    });

    async function generate() {
      const prompt = promptEl.value.trim();
      if (!prompt) return;

      btnEl.disabled = true;
      btnEl.textContent = "Thinking...";
      outputEl.innerHTML = '<div class="loading"><span class="spinner"></span>Matching memes...</div>';

      try {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt }),
        });

        const data = await res.json();

        if (!res.ok) {
          outputEl.innerHTML = '<div class="error-msg">' + escapeHtml(data.error || "Something went wrong") + '</div>';
          return;
        }

        if (!data.memes || data.memes.length === 0) {
          outputEl.innerHTML = '<div class="error-msg">No memes matched. Try a different prompt.</div>';
          return;
        }

        outputEl.innerHTML = data.memes.map(renderMemeCard).join("");
      } catch (err) {
        outputEl.innerHTML = '<div class="error-msg">Failed to connect. Try again.</div>';
        console.error(err);
      } finally {
        btnEl.disabled = false;
        btnEl.textContent = "Generate Memes";
      }
    }

    function renderMemeCard(meme) {
      const typeClass = meme.type || "image";
      const slots = meme.text || {};
      const slotsHtml = Object.entries(slots)
        .map(([key, val]) =>
          '<div class="slot">' +
            '<div class="slot-label">' + escapeHtml(key.replace(/-/g, " ")) + '</div>' +
            '<div class="slot-value">' + escapeHtml(val) + '</div>' +
          '</div>'
        )
        .join("");

      // Show the meme template image/gif if we have a URL
      const imageHtml = meme.templateUrl
        ? '<img class="meme-image" src="' + escapeHtml(meme.templateUrl) + '" alt="' + escapeHtml(meme.name) + '" loading="lazy">'
        : '';

      return (
        '<div class="meme-card">' +
          '<div class="meme-header">' +
            '<span class="meme-name">' + escapeHtml(meme.name) + '</span>' +
            '<span class="meme-type ' + typeClass + '">' + typeClass + '</span>' +
          '</div>' +
          imageHtml +
          '<div class="meme-text">' + slotsHtml + '</div>' +
          (meme.explanation ? '<div class="explanation">' + escapeHtml(meme.explanation) + '</div>' : '') +
        '</div>'
      );
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
