<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header { padding: 2rem 1rem 1rem; text-align: center; }
    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p { color: #888; margin-top: 0.5rem; font-size: 1rem; }
    .input-area { width: 100%; max-width: 640px; padding: 1rem; margin-top: 1rem; }
    .input-area textarea {
      width: 100%; padding: 1rem; font-size: 1rem; font-family: inherit;
      background: #1a1a1a; border: 2px solid #333; border-radius: 12px;
      color: #e0e0e0; resize: vertical; min-height: 80px; transition: border-color 0.2s;
    }
    .input-area textarea:focus { outline: none; border-color: #ff6b6b; }
    .input-area textarea::placeholder { color: #555; }
    .input-area button {
      margin-top: 0.75rem; width: 100%; padding: 0.85rem; font-size: 1.1rem;
      font-weight: 600; background: linear-gradient(135deg, #ff6b6b, #ee5a24);
      color: white; border: none; border-radius: 10px; cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .input-area button:hover { opacity: 0.9; }
    .input-area button:active { transform: scale(0.98); }
    .input-area button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .loading { text-align: center; padding: 2rem; color: #888; font-size: 1.1rem; }
    .loading .spinner {
      display: inline-block; width: 24px; height: 24px;
      border: 3px solid #333; border-top-color: #ff6b6b; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-right: 0.5rem; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .results { width: 100%; max-width: 640px; padding: 0 1rem 2rem; }
    .meme-card {
      background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px;
      padding: 1.25rem; margin-bottom: 1.5rem; transition: border-color 0.2s;
    }
    .meme-card:hover { border-color: #444; }
    .meme-card .meme-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
    .meme-card .meme-name { font-size: 1.15rem; font-weight: 700; color: #fff; }
    .meme-card .meme-type { font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 20px; font-weight: 600; text-transform: uppercase; }
    .meme-type.image { background: #2d3436; color: #74b9ff; }
    .meme-type.gif { background: #2d3436; color: #55efc4; }
    .meme-card canvas { width: 100%; border-radius: 8px; display: block; }
    .meme-card .meme-actions { margin-top: 0.5rem; display: flex; gap: 0.5rem; }
    .meme-card .meme-actions button {
      padding: 0.4rem 0.8rem; font-size: 0.8rem; background: #2a2a2a;
      border: 1px solid #444; border-radius: 6px; color: #ccc; cursor: pointer;
      font-family: inherit; width: auto; font-weight: 500;
    }
    .meme-card .meme-actions button:hover { background: #333; color: #fff; }
    .meme-card .explanation { font-size: 0.85rem; color: #888; font-style: italic; margin-top: 0.5rem; }
    .error-msg { text-align: center; padding: 1.5rem; color: #ff6b6b; font-size: 0.95rem; }
    .examples { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem; }
    .examples button {
      padding: 0.4rem 0.8rem; font-size: 0.8rem; background: #1a1a1a;
      border: 1px solid #333; border-radius: 20px; color: #aaa; cursor: pointer;
      transition: all 0.2s; font-family: inherit; width: auto; font-weight: 400;
    }
    .examples button:hover { border-color: #ff6b6b; color: #fff; background: #222; }
  </style>
</head>
<body>
  <header>
    <h1>Memer</h1>
    <p>Describe a situation or paste a news headline. Get the perfect memes.</p>
  </header>
  <div class="input-area">
    <textarea id="prompt" placeholder="e.g. 'When the meeting that could've been an email finally ends' or paste a news headline..." rows="3"></textarea>
    <div class="examples">
      <button onclick="useExample(this)">Meeting that could've been an email</button>
      <button onclick="useExample(this)">Congress can't agree on anything</button>
      <button onclick="useExample(this)">My code works but I don't know why</button>
      <button onclick="useExample(this)">Bitcoin hit a new all time high</button>
    </div>
    <button id="generate" onclick="generate()">Generate Memes</button>
  </div>
  <div id="output" class="results"></div>

<script>
const promptEl = document.getElementById("prompt");
const outputEl = document.getElementById("output");
const btnEl = document.getElementById("generate");

function useExample(el) { promptEl.value = el.textContent; promptEl.focus(); }
promptEl.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) generate(); });

async function generate() {
  const prompt = promptEl.value.trim();
  if (!prompt) return;
  btnEl.disabled = true;
  btnEl.textContent = "Thinking...";
  outputEl.innerHTML = '<div class="loading"><span class="spinner"></span>Matching memes...</div>';
  try {
    const res = await fetch("/api/generate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt }) });
    const data = await res.json();
    if (!res.ok) { outputEl.innerHTML = '<div class="error-msg">' + esc(data.error || "Something went wrong") + '</div>'; return; }
    if (!data.memes || data.memes.length === 0) { outputEl.innerHTML = '<div class="error-msg">No memes matched. Try a different prompt.</div>'; return; }
    outputEl.innerHTML = "";
    data.memes.forEach((meme, i) => buildCard(meme, i));
  } catch (err) { outputEl.innerHTML = '<div class="error-msg">Failed to connect. Try again.</div>'; console.error(err); }
  finally { btnEl.disabled = false; btnEl.textContent = "Generate Memes"; }
}

function buildCard(meme, idx) {
  const card = document.createElement("div"); card.className = "meme-card";
  const t = meme.type || "image";
  const hdr = document.createElement("div"); hdr.className = "meme-header";
  hdr.innerHTML = '<span class="meme-name">' + esc(meme.name) + '</span><span class="meme-type ' + t + '">' + t + '</span>';
  card.appendChild(hdr);
  const canvas = document.createElement("canvas"); canvas.id = "mc-" + idx; card.appendChild(canvas);
  const acts = document.createElement("div"); acts.className = "meme-actions";
  const dl = document.createElement("button"); dl.textContent = "Download";
  dl.onclick = () => { const a = document.createElement("a"); a.download = meme.id + ".png"; a.href = canvas.toDataURL("image/png"); a.click(); };
  acts.appendChild(dl); card.appendChild(acts);
  if (meme.explanation) { const e = document.createElement("div"); e.className = "explanation"; e.textContent = meme.explanation; card.appendChild(e); }
  outputEl.appendChild(card);
  renderMeme(canvas, meme);
}

// =============================================================================
// PER-MEME LAYOUT DEFINITIONS
// =============================================================================
// Each zone: { x, y, w, h } as fractions (0-1) of image size
// style: "impact" = white Impact + black outline
//        "label"  = white text on dark rounded-rect background
// Memes not listed here use the "caption bar" renderer (black bar above image)

const ZONES = {
  // ---- TWO-PANEL: top/bottom halves, text on the right side ----
  "drake":        [{ x:.50, y:.02, w:.48, h:.46, s:"impact" }, { x:.50, y:.52, w:.48, h:.46, s:"impact" }],
  "tuxedo-pooh":  [{ x:.50, y:.02, w:.48, h:.46, s:"impact" }, { x:.50, y:.52, w:.48, h:.46, s:"impact" }],

  // ---- TWO-PANEL: left/right halves ----
  "buff-doge-cheems":         [{ x:.02, y:.03, w:.46, h:.28, s:"impact" }, { x:.52, y:.03, w:.46, h:.28, s:"impact" }],
  "woman-yelling-at-cat":     [{ x:.02, y:.03, w:.48, h:.26, s:"impact" }, { x:.52, y:.03, w:.46, h:.26, s:"impact" }],
  "evil-kermit":              [{ x:.02, y:.68, w:.46, h:.30, s:"impact" }, { x:.52, y:.68, w:.46, h:.30, s:"impact" }],

  // ---- TWO-PANEL: custom layouts ----
  "thinking-about-other-women": [{ x:.02, y:.03, w:.55, h:.22, s:"impact" }, { x:.40, y:.55, w:.58, h:.22, s:"impact" }],

  // ---- MULTI-PANEL: text on left half, image on right (e.g. expanding brain) ----
  "expanding-brain": [
    { x:.02, y:.01, w:.46, h:.24, s:"impact" }, { x:.02, y:.26, w:.46, h:.24, s:"impact" },
    { x:.02, y:.51, w:.46, h:.24, s:"impact" }, { x:.02, y:.76, w:.46, h:.23, s:"impact" },
  ],
  "panik-kalm-panik": [
    { x:.02, y:.02, w:.46, h:.30, s:"impact" }, { x:.02, y:.35, w:.46, h:.30, s:"impact" },
    { x:.02, y:.68, w:.46, h:.30, s:"impact" },
  ],

  // ---- MULTI-PANEL: text overlaid on full-width rows ----
  "clown-makeup": [
    { x:.05, y:.02, w:.90, h:.23, s:"impact" }, { x:.05, y:.27, w:.90, h:.23, s:"impact" },
    { x:.05, y:.52, w:.90, h:.23, s:"impact" }, { x:.05, y:.77, w:.90, h:.22, s:"impact" },
  ],
  "inhaling-seagull": [
    { x:.05, y:.02, w:.90, h:.23, s:"impact" }, { x:.05, y:.27, w:.90, h:.23, s:"impact" },
    { x:.05, y:.52, w:.90, h:.23, s:"impact" }, { x:.05, y:.77, w:.90, h:.22, s:"impact" },
  ],
  "american-chopper": [
    { x:.05, y:.01, w:.90, h:.18, s:"impact" }, { x:.05, y:.21, w:.90, h:.18, s:"impact" },
    { x:.05, y:.41, w:.90, h:.18, s:"impact" }, { x:.05, y:.61, w:.90, h:.18, s:"impact" },

  "bike-fall": [

  // ---- MULTI-PANEL: 2x2 grid ----
  "grus-plan": [
    { x:.04, y:.04, w:.42, h:.42, s:"impact" }, { x:.54, y:.04, w:.42, h:.42, s:"impact" },
    { x:.04, y:.54, w:.42, h:.42, s:"impact" }, { x:.54, y:.54, w:.42, h:.42, s:"impact" },
  ],
  "anakin-padme": [
    { x:.04, y:.04, w:.42, h:.42, s:"impact" }, { x:.54, y:.04, w:.42, h:.42, s:"impact" },
    { x:.04, y:.54, w:.42, h:.42, s:"impact" }, { x:.54, y:.54, w:.42, h:.42, s:"impact" },
  ],
  "boardroom-meeting": [
    { x:.04, y:.04, w:.42, h:.42, s:"impact" }, { x:.54, y:.04, w:.42, h:.42, s:"impact" },
    { x:.04, y:.54, w:.42, h:.42, s:"impact" }, { x:.54, y:.54, w:.42, h:.42, s:"impact" },
  ],

  // ---- TOP-BOTTOM: classic Impact at top and bottom of image ----
  "one-does-not-simply": [{ x:.05, y:.02, w:.90, h:.28, s:"impact" }, { x:.05, y:.70, w:.90, h:.28, s:"impact" }],
  "futurama-fry":        [{ x:.05, y:.02, w:.90, h:.28, s:"impact" }, { x:.05, y:.70, w:.90, h:.28, s:"impact" }],
  "success-kid":         [{ x:.05, y:.02, w:.90, h:.28, s:"impact" }, { x:.05, y:.70, w:.90, h:.28, s:"impact" }],

  // ---- SPEECH BUBBLE: left and right bubbles ----
  "batman-slapping-robin": [{ x:.04, y:.03, w:.44, h:.32, s:"impact" }, { x:.52, y:.03, w:.44, h:.32, s:"impact" }],

  // ---- LABEL: positioned text with dark background ----
  "distracted-boyfriend": [
    { x:.35, y:.60, w:.28, h:.16, s:"label" },  // boyfriend (center)
    { x:.04, y:.60, w:.28, h:.16, s:"label" },  // other woman (left)
    { x:.68, y:.55, w:.28, h:.16, s:"label" },  // girlfriend (right)
  ],
  "two-buttons": [
    { x:.08, y:.05, w:.36, h:.20, s:"label" },  // button 1 (left)
    { x:.56, y:.05, w:.36, h:.20, s:"label" },  // button 2 (right)
    { x:.20, y:.72, w:.60, h:.18, s:"label" },  // person (bottom center)
  ],
  "same-picture": [
    { x:.08, y:.05, w:.38, h:.28, s:"label" },  // image 1 (top-left)
    { x:.54, y:.05, w:.38, h:.28, s:"label" },  // image 2 (top-right)
  ],
  "epic-handshake": [
    { x:.02, y:.06, w:.30, h:.22, s:"label" },  // left arm
    { x:.68, y:.06, w:.30, h:.22, s:"label" },  // right arm
    { x:.22, y:.72, w:.56, h:.22, s:"label" },  // handshake
  ],
  "bell-curve": [
    { x:.02, y:.58, w:.26, h:.38, s:"label" },  // low IQ (left)
    { x:.37, y:.06, w:.26, h:.38, s:"label" },  // mid IQ (center top)
    { x:.72, y:.58, w:.26, h:.38, s:"label" },  // high IQ (right)
  ],
  "change-my-mind": [
    { x:.08, y:.52, w:.58, h:.34, s:"label" },  // sign text
  ],
  "uno-draw-25": [
    { x:.04, y:.18, w:.42, h:.55, s:"label" },  // card text (left)
    { x:.54, y:.68, w:.42, h:.26, s:"label" },  // person label (right)
  ],
  "running-away-balloon": [
    { x:.40, y:.58, w:.28, h:.16, s:"label" },  // person
    { x:.18, y:.04, w:.28, h:.16, s:"label" },  // floating balloon
    { x:.58, y:.32, w:.28, h:.16, s:"label" },  // ground balloon
  ],
};

// =============================================================================
// MAIN RENDER FUNCTION
// =============================================================================

function renderMeme(canvas, meme) {
  const ctx = canvas.getContext("2d");
  const img = new Image();
  img.crossOrigin = "anonymous";

  img.onload = () => {
    const texts = Object.values(meme.text || {}).map(String);
    const zones = ZONES[meme.id];

    if (zones) {
      // Zone-based rendering: draw image, then text in each zone
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      ctx.drawImage(img, 0, 0);
      zones.forEach((zone, i) => {
        if (i >= texts.length || !texts[i]) return;
        if (zone.s === "label") {
          drawLabel(ctx, texts[i], zone, canvas.width, canvas.height);
        } else {
          drawImpact(ctx, texts[i], zone, canvas.width, canvas.height);
        }
      });
    } else {
      // No zone layout = caption bar above image
      drawCaptionBar(canvas, ctx, img, texts.join(" "));
    }
  };

  img.onerror = () => {
    canvas.width = 500; canvas.height = 300;
    ctx.fillStyle = "#111"; ctx.fillRect(0, 0, 500, 300);
    ctx.fillStyle = "#fff"; ctx.font = "bold 20px sans-serif"; ctx.textAlign = "center";
    Object.values(meme.text || {}).forEach((t, i) => ctx.fillText(String(t), 250, 80 + i * 50));
  };

  img.src = meme.templateUrl || "";
}

// =============================================================================
// CAPTION BAR (black bar with white text above the image)
// Used for: caption-above, reaction, and any meme not in ZONES
// =============================================================================

function drawCaptionBar(canvas, ctx, img, text) {
  const W = img.naturalWidth;
  const H = img.naturalHeight;
  const pad = Math.round(W * 0.03);
  const maxTextW = W - pad * 2;
  const font = "-apple-system, 'Segoe UI', sans-serif";

  // Auto-fit: start large, shrink until text fits in <=4 lines
  let sz = Math.max(16, Math.round(W / 16));
  const minSz = Math.max(12, Math.round(W / 40));
  let lines;

  while (sz >= minSz) {
    ctx.font = "bold " + sz + "px " + font;
    lines = wrap(ctx, text, maxTextW);
    if (lines.length <= 4) break;
    sz -= 1;
  }
  if (!lines || lines.length === 0) { ctx.font = "bold " + minSz + "px " + font; lines = wrap(ctx, text, maxTextW); }

  const lh = Math.round(sz * 1.35);
  const barH = lines.length * lh + pad * 2;

  canvas.width = W;
  canvas.height = H + barH;

  // Black bar
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, barH);

  // White text
  ctx.fillStyle = "#fff";
  ctx.font = "bold " + sz + "px " + font;
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  lines.forEach((line, i) => ctx.fillText(line, W / 2, pad + i * lh));

  // Image below
  ctx.drawImage(img, 0, barH, W, H);
}

// =============================================================================
// IMPACT TEXT IN A ZONE (white text, thick black outline)
// =============================================================================

function drawImpact(ctx, text, zone, imgW, imgH) {
  const zx = zone.x * imgW, zy = zone.y * imgH;
  const zw = zone.w * imgW, zh = zone.h * imgH;
  const innerW = zw * 0.92;  // slight padding inside zone
  const innerH = zh * 0.90;
  const font = "Impact, 'Arial Black', sans-serif";

  // Auto-fit font size to the zone
  const fit = autoFit(ctx, text.toUpperCase(), innerW, innerH, font);

  ctx.save();
  ctx.font = "bold " + fit.sz + "px " + font;
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  ctx.lineJoin = "round";

  // Center block vertically in zone
  const totalH = fit.lines.length * fit.lh;
  const startY = zy + (zh - totalH) / 2;
  const cx = zx + zw / 2;

  fit.lines.forEach((line, i) => {
    const ly = startY + i * fit.lh;
    ctx.strokeStyle = "#000";
    ctx.lineWidth = Math.max(2, Math.round(fit.sz / 8));
    ctx.strokeText(line, cx, ly);
    ctx.fillStyle = "#fff";
    ctx.fillText(line, cx, ly);
  });
  ctx.restore();
}

// =============================================================================
// LABEL TEXT IN A ZONE (white text on semi-transparent dark rounded rect)
// =============================================================================

function drawLabel(ctx, text, zone, imgW, imgH) {
  const zx = zone.x * imgW, zy = zone.y * imgH;
  const zw = zone.w * imgW, zh = zone.h * imgH;
  const innerW = zw * 0.88;
  const innerH = zh * 0.80;
  const font = "-apple-system, 'Segoe UI', Arial, sans-serif";

  const fit = autoFit(ctx, text, innerW, innerH, font);
  const pad = Math.round(fit.sz * 0.4);
  const totalH = fit.lines.length * fit.lh;

  // Background rect, vertically centered in zone
  const bgW = zw;
  const bgH = totalH + pad * 2;
  const bgX = zx;
  const bgY = zy + (zh - bgH) / 2;
  const r = Math.min(8, Math.round(fit.sz * 0.3));

  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.75)";
  roundRect(ctx, bgX, bgY, bgW, bgH, r);
  ctx.fill();

  ctx.fillStyle = "#fff";
  ctx.font = "bold " + fit.sz + "px " + font;
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  const startY = bgY + pad;
  const cx = zx + zw / 2;
  fit.lines.forEach((line, i) => ctx.fillText(line, cx, startY + i * fit.lh));
  ctx.restore();
}

// =============================================================================
// AUTO-FIT: finds the largest font size where wrapped text fits in a box
// =============================================================================

function autoFit(ctx, text, maxW, maxH, fontFamily) {
  // Start font size proportional to zone dimensions
  let sz = Math.round(Math.min(maxH * 0.45, maxW * 0.18));
  sz = Math.max(sz, 10);
  const minSz = Math.max(8, Math.round(maxH * 0.10));

  while (sz >= minSz) {
    ctx.font = "bold " + sz + "px " + fontFamily;
    const lines = wrap(ctx, text, maxW);
    const lh = Math.round(sz * 1.18);
    if (lines.length * lh <= maxH) {
      return { sz, lines, lh };
    }
    sz -= 1;
  }
  // At minimum size
  ctx.font = "bold " + minSz + "px " + fontFamily;
  return { sz: minSz, lines: wrap(ctx, text, maxW), lh: Math.round(minSz * 1.18) };
}

// =============================================================================
// WORD WRAP
// =============================================================================

function wrap(ctx, text, maxW) {
  if (!text) return [""];
  const words = text.split(" ");
  const lines = [];
  let cur = "";
  for (const word of words) {
    const test = cur ? cur + " " + word : word;
    if (ctx.measureText(test).width > maxW && cur) {
      lines.push(cur);
      cur = word;
    } else {
      cur = test;
    }
  }
  if (cur) lines.push(cur);
  return lines.length ? lines : [""];
}

// =============================================================================
// ROUNDED RECT HELPER
// =============================================================================

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function esc(str) { const d = document.createElement("div"); d.textContent = str; return d.innerHTML; }
</script>
</body>
</html>
